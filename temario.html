function renderChildren(items){return '<ul>'+items.map(s=>'<li>'+s.label+(s.children?.length?renderChildren(s.children):'')+'</li>').join('')+'</ul>'}
function renderSection(s,k){const title='<b>'+String(k).padStart(2,'0')+'</b><span>'+s.label+'</span>';return s.children?.length?'<div class="section"><button type="button" class="section-toggle" aria-expanded="false" aria-controls="section-'+k+'">'+title+'<i aria-hidden="true">+</i></button><div class="subcontents" id="section-'+k+'" hidden>'+renderChildren(s.children)+'</div></div>':'<div class="row">'+title+'</div>'}
document.getElementById('content').addEventListener('click',e=>{const button=e.target.closest('.section-toggle');if(!button)return;const expanded=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!expanded));document.getElementById(button.getAttribute('aria-controls')).hidden=expanded;button.querySelector('i').textContent=expanded?'+':'−'});
function openTopic(n){current=n;document.getElementById('detailnum').textContent='TEMA '+String(n).padStart(2,'0')+' · '+(n<=3?'FUNDAMENTOS':'ESPECTROS DE PSICOPATOLOGÍA');document.getElementById('detailtitle').textContent=topics[n].title;let k=0;document.getElementById('content').innerHTML=topics[n].sections.map(s=>renderSection(s,++k)).join('');if(!d.open)d.showModal();d.scrollTop=0;document.getElementById('close').focus()}
